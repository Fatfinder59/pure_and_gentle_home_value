<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HomeSpend</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f3ee;
        color: #111;
      }
      .app {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 24px;
      }
      .card {
        background: white;
        width: 100%;
        max-width: 420px;
        border-radius: 24px;
        padding: 28px;
        text-align: center;
        box-shadow: 0 8px 24px rgba(0,0,0,.12);
      }
      h1 { font-size: 38px; margin: 0; }
      .subtitle { color: #666; font-weight: bold; }
      button {
        margin-top: 22px;
        padding: 14px 26px;
        border-radius: 16px;
        border: 2px solid #111;
        background: #111;
        color: white;
        font-size: 16px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="card">
        <h1>HomeSpend</h1>
        <p class="subtitle">Where Your Money Really Goes</p>
        <h2>Pure & Gentle Home Value App</h2>
        <p>Your web app is running successfully.</p>
        <button onclick="alert('HomeSpend is working')">Start</button>
      </div>
    </div>
  </body>
</html>
